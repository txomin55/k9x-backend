# Fly.io deployment: production. Staging stays on Render, and the image is the same for both — it
# is profile-agnostic, and the profile, the database and every secret come from the machine's
# environment (see .env.production for the full list of what must be set here).
#
# Fly never builds this app: .github/workflows/deploy.yml builds the image once, pushes it to
# registry.fly.io and deploys it by digest, so there is no [build] section and no build credential
# to configure here. A deploy is the "Deploy production (Fly)" workflow, run manually; by hand it is
#
#   flyctl deploy --image registry.fly.io/k9x-backend:<tag>
#
# Runtime secrets are set once with `fly secrets set` (they are encrypted and injected as env vars):
#
#   fly secrets set POSTGRES_HOST=... POSTGRES_DATABASE=... POSTGRES_USERNAME=... \
#                   POSTGRES_PASSWORD=... JWT_SECRET=... GOOGLE_CLIENT_ID=... \
#                   GOOGLE_CLIENT_SECRET=... GOOGLE_REDIRECT_URL=... \
#                   VAPID_PUBLIC_KEY=... VAPID_PRIVATE_KEY=... VAPID_SUBJECT=...

app = 'k9x-backend'
primary_region = 'cdg'

[env]
  SPRING_PROFILES_ACTIVE = 'deployed'
  PORT = '4000'
  POSTGRES_PORT = '5432'
  POSTGRES_SSLMODE = 'require'
  HIKARI_MAX_POOL_SIZE = '7'

[http_service]
  internal_port = 4000
  force_https = true
  # The daily snapshot cron only runs if the machine is up, so it must never be stopped when idle.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  # `deployed` exposes only the health actuator endpoint (application-deployed.yml).
  [[http_service.checks]]
    grace_period = '60s'
    interval = '30s'
    timeout = '5s'
    method = 'GET'
    path = '/actuator/health/readiness'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
