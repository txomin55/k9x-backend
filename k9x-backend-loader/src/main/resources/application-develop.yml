spring:
  datasource:
    url: jdbc:postgresql://localhost:2345/k9x-backend
    username: admin
    password: password
    driver-class-name: org.postgresql.Driver
  jooq:
    sql-dialect: POSTGRES

k9x-backend:
  security:
    refresh-cookie:
      same-site: "Lax"
      secure: false

# Local only: el cron de snapshots corre cada 2 minutos en lugar de a las 01:00 UTC.
k9x:
  snapshot:
    cron: "0 /2 * * * *"
