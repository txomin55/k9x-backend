spring:
  datasource:
    url: jdbc:postgresql://localhost:2345/k9x-backend
    username: admin
    password: password
    driver-class-name: org.postgresql.Driver
  jooq:
    sql-dialect: POSTGRES

k9x-backend:
  security:
    refresh-cookie:
      same-site: "Lax"
      secure: false

# Local only: los crons corren cada 2 minutos en lugar de su horario real
# (snapshots: 01:00 UTC diario; dog rank: día 1 y 16 a las 02:00 UTC).
k9x:
  snapshot:
    cron: "0 */2 * * * *"
  dog-rank:
    cron: "0 */2 * * * *"
