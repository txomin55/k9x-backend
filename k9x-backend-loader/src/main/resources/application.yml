spring:
  application:
    name: k9x-backend
  banner:
    location: classpath:banner.txt
  profiles:
    active: '@spring.profiles.active@'
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

server:
  port: 4000

k9x-backend:
  timeoutValue: 5000
  security:
    jwt-secret: "change-me-to-a-32-byte-minimum-secret"
    jwt-cache-ttl-minutes: 15
    jwt-refresh-ttl-days: 30
    refresh-cookie:
      same-site: "None"
      secure: true
  info:
    app:
      name: '@project.artifactId@'
      version: '@project.version@'
  geo:
    nominatim:
      user-agent: "k9x-backend/1.0 (txomin.sirera@clarity.ai)"
  login:
    google:
      client_id: "${GOOGLE_CLIENT_ID:@google.client_id@}"
      client_secret: "${GOOGLE_CLIENT_SECRET:@google.client_secret@}"
      redirect_url: "${GOOGLE_REDIRECT_URL:@google.redirect_url@}"
  push:
    vapid:
      public-key: "${VAPID_PUBLIC_KEY:BNIMHEea0OJUDPaknHTjF2zaN4fMRh-rmtBc5FPlDy7OqHChTEK2SM_Ru1PM4rjtMCdEmaNUPd8Nr94mEkXD9b0}"
      private-key: "${VAPID_PRIVATE_KEY:ogwPEP4WkygHksYC1tSqcPrxxNuXEIFHgbydYVBfU9E}"
      subject: "${VAPID_SUBJECT:mailto:txomin.sirera@gmail.com}"
