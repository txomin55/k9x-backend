spring:
  application:
    name: k9x-backend
  threads:
    # Tomcat sirve cada request en un virtual thread, y @Async/@Scheduled pasan a los
    # SimpleAsyncTask{Executor,Scheduler} virtuales. Todo el I/O del backend es bloqueante y
    # virtual-thread-friendly: java.net.http.HttpClient (Nominatim, Google), sockets del driver
    # pgjdbc y web-push. En Java 25 `synchronized` ya no fija el carrier thread (JEP 491), asi que
    # los bloques sincronizados de pgjdbc tampoco bloquean la plataforma.
    # Ojo: el paralelismo real de las operaciones con base de datos lo sigue limitando el pool de
    # Hikari (maximum-pool-size), no el numero de threads.
    virtual:
      enabled: true
  banner:
    location: classpath:banner.txt
  profiles:
    # Runtime env var (Spring's native SPRING_PROFILES_ACTIVE), no longer baked in at build time.
    active: ${SPRING_PROFILES_ACTIVE:local}
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

server:
  # Render injects PORT into every web service and scans that port first, so honouring it makes
  # the platform detect the service as soon as it binds.
  port: ${PORT:4000}

# Secrets have no fallback on purpose: a missing variable must fail startup instead of silently
# booting with a value committed to the repo. Local profiles load them from a git-ignored .env
# file (see application-local*.yml); deployed environments get them from the platform.
k9x-backend:
  timeoutValue: 5000
  security:
    jwt-secret: ${JWT_SECRET}
    jwt-cache-ttl-minutes: 15
    jwt-refresh-ttl-days: 30
    refresh-cookie:
      same-site: "None"
      secure: true
  info:
    app:
      name: '@project.artifactId@'
      version: '@project.version@'
  geo:
    nominatim:
      user-agent: "k9x-backend/1.0 (txomin.sirera@clarity.ai)"
  login:
    google:
      client_id: ${GOOGLE_CLIENT_ID}
      client_secret: ${GOOGLE_CLIENT_SECRET}
      redirect_url: ${GOOGLE_REDIRECT_URL}
  crons:
    dog-rank:
      # Dogs per block of the index history cron: each block is read, computed and committed on its own, so
      # the heap holds one block at a time instead of every dog's timeline (the first run rebuilds them all).
      block-size: 200
  observability:
    otlp-export-enabled: ${OTLP_EXPORT_ENABLED:false}
  push:
    vapid:
      public-key: ${VAPID_PUBLIC_KEY}
      private-key: ${VAPID_PRIVATE_KEY}
      subject: ${VAPID_SUBJECT}

# Observability over OTLP: metrics (Micrometer), traces (Micrometer Tracing) and logs (the OpenTelemetry
# Logback appender, see logback-spring.xml). It replaces the New Relic Java agent, which a native image cannot
# load, and sends to New Relic's OTLP endpoint. Off unless OTLP_EXPORT_ENABLED=true, which only production sets
# (fly.toml); NEW_RELIC_LICENSE_KEY is then a platform secret. In the native image the `enabled` switches below
# only gate metrics; traces and logs are gated by OpenTelemetryExportConfiguration, which reads the flag here.
management:
  tracing:
    # Sampling is all or nothing, see OpenTelemetryExportConfiguration.
    export:
      enabled: ${OTLP_EXPORT_ENABLED:false}
  otlp:
    metrics:
      export:
        enabled: ${OTLP_EXPORT_ENABLED:false}
        url: ${OTLP_ENDPOINT:https://otlp.eu01.nr-data.net:4318}/v1/metrics
        headers:
          api-key: ${NEW_RELIC_LICENSE_KEY:}
        # New Relic stores metrics as deltas; cumulative ones would be converted on ingest.
        aggregation-temporality: delta
        compression-mode: gzip
  logging:
    export:
      otlp:
        enabled: ${OTLP_EXPORT_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_ENDPOINT:https://otlp.eu01.nr-data.net:4318}/v1/traces
          headers:
            api-key: ${NEW_RELIC_LICENSE_KEY:}
          compression: gzip
      # New Relic drops attribute values longer than 4095 characters.
      limits:
        max-attribute-value-length: 4095
    logging:
      export:
        otlp:
          endpoint: ${OTLP_ENDPOINT:https://otlp.eu01.nr-data.net:4318}/v1/logs
          headers:
            api-key: ${NEW_RELIC_LICENSE_KEY:}
          compression: gzip
      limits:
        max-attribute-value-length: 4095
