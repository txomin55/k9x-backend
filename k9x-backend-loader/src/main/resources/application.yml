spring:
  application:
    name: k9x-backend
  banner:
    location: classpath:banner.txt
  profiles:
    # Runtime env var (Spring's native SPRING_PROFILES_ACTIVE), no longer baked in at build time.
    active: ${SPRING_PROFILES_ACTIVE:local}
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

server:
  port: ${SERVER_PORT:4000}

# Secrets have no fallback on purpose: a missing variable must fail startup instead of silently
# booting with a value committed to the repo. Local profiles load them from a git-ignored .env
# file (see application-local*.yml); deployed environments get them from the platform.
k9x-backend:
  timeoutValue: 5000
  security:
    jwt-secret: ${JWT_SECRET}
    jwt-cache-ttl-minutes: 15
    jwt-refresh-ttl-days: 30
    refresh-cookie:
      same-site: "None"
      secure: true
  info:
    app:
      name: '@project.artifactId@'
      version: '@project.version@'
  geo:
    nominatim:
      user-agent: "k9x-backend/1.0 (txomin.sirera@clarity.ai)"
  login:
    google:
      client_id: ${GOOGLE_CLIENT_ID}
      client_secret: ${GOOGLE_CLIENT_SECRET}
      redirect_url: ${GOOGLE_REDIRECT_URL}
  push:
    vapid:
      public-key: ${VAPID_PUBLIC_KEY}
      private-key: ${VAPID_PRIVATE_KEY}
      subject: ${VAPID_SUBJECT}
