# Any deployed environment (staging, production, …). It replaces the old `staging` and
# `production` profiles, which were identical apart from the connection pool size: what changes
# between deployments is the environment variables set on the platform, not the profile.
# Nothing is defaulted here — every value comes from the platform's environment (see .env.example).
spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT:5432}/${POSTGRES_DATABASE}?sslmode=${POSTGRES_SSLMODE:require}
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:7}
      minimum-idle: 1
  jooq:
    sql-dialect: POSTGRES

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health
