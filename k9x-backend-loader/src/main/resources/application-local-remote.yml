# App running on the developer machine against the remote (Supabase) database — the old
# `local-pro` profile. Credentials come from the git-ignored .env.local-remote at the repository
# root; see application-local.yml for why two paths are imported.
spring:
  config:
    import:
      - optional:file:./.env.local-remote[.properties]
      - optional:file:../.env.local-remote[.properties]
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT:5432}/${POSTGRES_DATABASE}?sslmode=${POSTGRES_SSLMODE:require}
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:4}
      minimum-idle: 1
  jooq:
    sql-dialect: POSTGRES
