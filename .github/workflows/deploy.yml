# Nothing here runs on its own: there is no push trigger, no schedule. Deploying is always someone
# running this workflow and choosing an environment.
#
#   staging      builds the image from the chosen ref, publishes it, points Render at it and moves
#                the `staging` tag onto it.
#   production   deploys the image the `staging` tag currently holds — no rebuild, no choice of
#                version. What production runs is what staging validated, by digest.
#
# The image is built here and nowhere else: neither Render nor Fly builds from source. That is what
# keeps the GitHub Packages token that resolves com.k9x:oas-definition-stubs inside this workflow.
#
# Repository secrets required:
#   FLY_API_TOKEN           `fly tokens create deploy -a k9x-backend`
#   RENDER_DEPLOY_HOOK_URL  Render dashboard → the staging service → Settings → Deploy Hook
#                           (turn Auto-Deploy off there, or Render deploys on its own on push)
#   GPR_KEY                 optional. Only needed if GITHUB_TOKEN cannot read the package; see below.

name: Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: Environment to deploy to
        required: true
        type: choice
        options: [staging, production]

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}
  FLY_IMAGE: registry.fly.io/k9x-backend

jobs:
  deploy:
    name: Deploy ${{ inputs.target }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # Fails in two seconds with a name, instead of ten lines into a tool that says only that it
      # has no credentials. A missing secret is by far the likeliest reason a deploy does not start.
      - name: Check the secrets this target needs
        run: |
          missing=
          [ -n "${{ secrets.FLY_API_TOKEN }}" ] || missing="$missing FLY_API_TOKEN"
          if [ "${{ inputs.target }}" = staging ]; then
            [ -n "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ] || missing="$missing RENDER_DEPLOY_HOOK_URL"
          fi
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing. Settings → Secrets and variables"\
                 "→ Actions → Repository secrets. Environment secrets and variables are not visible here."
            exit 1
          fi

      - uses: actions/checkout@v4
        if: inputs.target == 'staging'

      # Two registries for one image: Render pulls from GHCR, and Fly can only pull private images
      # from its own registry. Both pushes carry the same digest, so it is a single artifact.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Only the build pushes to Fly's registry; `flyctl deploy` authenticates with the token alone.
      - name: Log in to the Fly registry
        if: inputs.target == 'staging'
        run: flyctl auth docker
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - uses: docker/setup-buildx-action@v3
        if: inputs.target == 'staging'

      # GITHUB_TOKEN is ephemeral and expires with the job, so no long-lived PAT is involved. It can
      # only read the package once k9x-oas-definition grants this repository access (package →
      # Package settings → Manage Actions access). Until then, set a GPR_KEY repository secret with
      # a PAT and it takes precedence.
      - name: Build and push
        if: inputs.target == 'staging'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.GHCR_IMAGE }}:sha-${{ github.sha }}
            ${{ env.FLY_IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GPR_USER=${{ github.actor }}
            GPR_KEY=${{ secrets.GPR_KEY || secrets.GITHUB_TOKEN }}

      # Production deploys by digest, so a tag rewritten in the meantime cannot change what ships.
      - name: Resolve the image
        id: image
        run: |
          if [ "${{ inputs.target }}" = staging ]; then
            tag="sha-$GITHUB_SHA"
          else
            tag=staging
          fi
          if ! digest=$(docker buildx imagetools inspect "$GHCR_IMAGE:$tag" \
                          --format '{{.Manifest.Digest}}' 2>/dev/null); then
            echo "::error::$GHCR_IMAGE:$tag does not exist. Deploy to staging first."
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Deploying $tag ($digest) to ${{ inputs.target }}."

      - name: Deploy to Render
        if: inputs.target == 'staging'
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      # Fly pulls from its own registry, where the image is tagged by commit, so the digest has to
      # be resolved back to that tag.
      - name: Deploy to Fly
        if: inputs.target == 'production'
        run: |
          flyctl deploy --app k9x-backend \
            --image "$FLY_IMAGE@${{ steps.image.outputs.digest }}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # Last, so the tag only moves if the deploy succeeded.
      - name: Move the ${{ inputs.target }} tag
        run: |
          docker buildx imagetools create \
            --tag "$GHCR_IMAGE:${{ inputs.target }}" "$GHCR_IMAGE@${{ steps.image.outputs.digest }}"
