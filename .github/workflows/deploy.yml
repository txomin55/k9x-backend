# Manual only: deploying is someone running this workflow, never a push.
#
# It builds the image from the chosen ref, publishes it to GHCR and deploys it. The image is built
# here and nowhere else, which is what keeps the GitHub Packages token that resolves
# com.k9x:oas-definition-stubs inside this workflow instead of on the platform.
#
# Fly pulls straight from GHCR, without registry.fly.io in the middle, which is only possible while
# the package is public — and it is what makes the images prunable, since flyctl has no command to
# delete anything from its own registry. Turning the package private breaks this deploy.
#
# The job runs in the `production` GitHub environment, which holds FLY_API_TOKEN
# (`fly tokens create deploy -a k9x-backend`) and can be put behind a required reviewer.
#
# Staging still deploys from Render on its own; when it moves here, this grows a second target.

name: Deploy production

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub release after deploying?'
        required: false
        default: false
        type: boolean
      release_tag:
        description: 'Custom tag name for the release (only used when creating a release)'
        required: false

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check the environment's secrets
        run: |
          [ -n "${{ secrets.FLY_API_TOKEN }}" ] || {
            echo "::error::The production environment has no FLY_API_TOKEN."; exit 1; }

      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GITHUB_TOKEN is ephemeral and expires with the job, so no long-lived PAT is involved. It can
      # only read the package once k9x-oas-definition grants this repository access (package →
      # Package settings → Manage Actions access). Until then, set a GPR_KEY repository secret with
      # a PAT and it takes precedence.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Without this, buildx attaches a provenance attestation and the result is an image index
          # with an extra unknown/unknown entry. Fly copes with it; Render starts the container and
          # it dies before the JVM prints a line.
          provenance: false
          tags: ${{ env.GHCR_IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GPR_USER=${{ github.actor }}
            GPR_KEY=${{ secrets.GPR_KEY || secrets.GITHUB_TOKEN }}

      - name: Deploy to Fly
        run: flyctl deploy --app k9x-backend --image "$GHCR_IMAGE:sha-$GITHUB_SHA"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # Last, so the tag only moves if the deploy succeeded: it is the record of what production
      # is running, and what a rollback looks up.
      - name: Move the production tag
        run: |
          digest=$(docker buildx imagetools inspect "$GHCR_IMAGE:sha-$GITHUB_SHA" \
                     --format '{{.Manifest.Digest}}')
          docker buildx imagetools create --tag "$GHCR_IMAGE:production" "$GHCR_IMAGE@$digest"

      - name: Set release tag
        id: release_vars
        if: ${{ github.event.inputs.create_release == 'true' }}
        env:
          CUSTOM_RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          if [ -n "$CUSTOM_RELEASE_TAG" ]; then
            echo "release_tag=$CUSTOM_RELEASE_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "release_tag=release-$(date -u +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@v2
        if: ${{ github.event.inputs.create_release == 'true' }}
        with:
          tag_name: ${{ steps.release_vars.outputs.release_tag }}
          name: Release ${{ steps.release_vars.outputs.release_tag }}
          body: "Image: `${{ env.GHCR_IMAGE }}:sha-${{ github.sha }}`"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The sha- tags pile up one per deploy. Storage is free while the package is public, so this
      # is only to keep the version list readable — and it runs last, so a failed deploy leaves the
      # previous images untouched. Staging publishes to this same package, so 5 is the shared budget:
      # the two running images plus a rollback each.
      - name: Prune old image versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: k9x-backend
          package-type: container
          min-versions-to-keep: 5
          delete-only-untagged-versions: false
